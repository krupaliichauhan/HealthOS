# HealthOS Database Configuration
# Primary: MySQL 8.x
db.type=mysql
db.host=localhost
db.port=3306
db.name=healthos
db.user=root
db.password=fairysoni
db.options=createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Resilient Embedded Database Fallback (Ensures zero-crash demo on any machine)
db.fallback.enabled=true
db.fallback.url=jdbc:h2:mem:healthos_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.fallback.user=sa
db.fallback.password=
