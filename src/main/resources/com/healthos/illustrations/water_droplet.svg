  <circle cx="49.5" cy="72.5" r="1.1" fill="#FFFFFF"/>
  <circle cx="73.5" cy="72.5" r="1.1" fill="#FFFFFF"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="42" cy="81" rx="4" ry="2.2" fill="#FF84A8" opacity="0.5"/>
  <ellipse cx="78" cy="81" rx="4" ry="2.2" fill="#FF84A8" opacity="0.5"/>
