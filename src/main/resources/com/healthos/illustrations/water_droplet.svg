<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9DE7FC"/>
      <stop offset="50%" stop-color="#55C7F7"/>
      <stop offset="100%" stop-color="#3FA8EB"/>
    </linearGradient>
    <filter id="waterShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4FB3EE" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Water Droplet Body -->
  <path d="M60 12 C60 12 22 55 22 80 C22 101 39 114 60 114 C81 114 98 101 98 80 C98 55 60 12 60 12 Z"
