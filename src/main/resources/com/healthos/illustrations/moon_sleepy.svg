  <polygon points="20,40 21,44 25,44 22,47 23,51 20,48 17,51 18,47 15,44 19,44" fill="#FFDA79"/>
  <text x="82" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A89ACF">z</text>
  <text x="92" y="48" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7C68B0">Z</text>
