      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="100%" stop-color="#FCD271"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9E3F7"/>
