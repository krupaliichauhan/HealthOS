  <!-- Sleepy Crescent Moon -->
  <path d="M50 15 C75 15 95 35 95 60 C95 85 75 105 50 105 C42 105 34 103 28 99 C48 94 63 76 63 55 C63 34 48 16 28 11 C34 7 42 15 50 15 Z"
