  <circle cx="58" cy="68" r="2.5" fill="#34433E"/>
  <circle cx="70" cy="68" r="2.5" fill="#34433E"/>
  <ellipse cx="53" cy="72" rx="2.5" ry="1.5" fill="#FFAAA6" opacity="0.6"/>
  <ellipse cx="75" cy="72" rx="2.5" ry="1.5" fill="#FFAAA6" opacity="0.6"/>
  <path d="M62 72 Q64 75 66 72" fill="none" stroke="#34433E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Laces -->
  <line x1="50" y1="44" x2="62" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="50" x2="66" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
