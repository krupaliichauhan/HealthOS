<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sneakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D5BE"/>
      <stop offset="100%" stop-color="#69B89E"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECE9"/>
    </linearGradient>
  </defs>
  <!-- Speed lines & Sparkles -->
  <path d="M12 70 L25 70" stroke="#78BDB1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M8 80 L20 80" stroke="#78BDB1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="98,18 100,23 105,23 101,26 103,31 98,28 93,31 95,26 91,23 96,23" fill="#FCE8DD"/>
  <!-- Sneaker Body -->
  <path d="M30 42 C30 42 36 32 48 32 C58 32 64 45 74 52 L95 56 C105 58 112 68 110 80 L28 80 C24 66 26 50 30 42 Z"
