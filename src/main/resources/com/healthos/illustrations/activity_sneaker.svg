  <path d="M92 56 C103 58 110 68 110 80 L96 80 C96 68 94 62 92 56 Z" fill="#FCE8DD"/>
  <!-- Sneaker Sole -->
  <rect x="24" y="80" width="88" height="15" rx="7.5" fill="url(#soleGrad)" stroke="#34433E" stroke-width="2"/>
  <line x1="38" y1="95" x2="102" y2="95" stroke="#34433E" stroke-width="1.5"/>
  <!-- Cute Chevron / Stripe on side -->
  <path d="M48 58 Q62 60 76 52" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
